<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboDojo 首尾帧聚类</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#252525;background:#fafafa;font:14px system-ui,sans-serif;letter-spacing:0}header{padding:14px 20px;border-bottom:1px solid #ddd;background:white}h1{font-size:20px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}#layout{display:grid;grid-template-columns:270px minmax(0,1fr);height:calc(100vh - 87px)}aside{overflow:auto;border-right:1px solid #ddd;background:white;padding:8px}button,select{font:inherit;cursor:pointer}aside button{display:block;text-align:left;width:100%;padding:10px;border:0;border-bottom:1px solid #eee;background:white;overflow-wrap:anywhere}aside button.active{background:#dcefe8;color:#124734}aside small{display:block;color:#666;margin-top:5px}main{overflow:auto;padding:20px;min-width:0}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}select{padding:7px;border:1px solid #aaa;border-radius:4px;max-width:100%}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:16px}article{border:1px solid #ddd;background:white;border-radius:4px;overflow:hidden}article h3{font-size:14px;margin:10px 12px;overflow-wrap:anywhere}article img{display:block;width:100%;aspect-ratio:8/3;object-fit:contain;background:#eee}article p{margin:10px 12px;color:#555}.labels{display:grid;grid-template-columns:1fr 1fr;text-align:center;padding:6px;background:#f0f3f2}#taskTitle{overflow-wrap:anywhere}#pairs{margin:12px 0;color:#555}#pairs div{padding:6px 0;overflow-wrap:anywhere}#summary{color:#555}#notice{color:#746025;font-size:13px;margin-top:6px}@media(max-width:700px){#layout{display:block;height:auto}aside{height:180px;border-bottom:1px solid #ddd}main{overflow:visible;padding:12px}header{padding:12px}#grid{grid-template-columns:1fr}}
</style>
<header><h1 id="heading">RoboDojo · 帧特征聚类</h1><div id="summary"></div><div id="notice"></div></header>
<div id="layout"><aside id="tasks" aria-label="任务列表"></aside><main><h2 id="taskTitle"></h2><div id="stats"></div><div class="controls"><label>分组 <select id="cluster"></select></label><label>样本 <select id="mode"><option value="all">全部</option><option value="center">中心代表</option><option value="boundary">边缘样本</option><option value="cross">跨簇近邻</option><option value="noise">未归类</option></select></label></div><div id="pairs"></div><div id="grid"></div></main></div>
<script src="data.js"></script><script>
const $=id=>document.getElementById(id);let current=0;
const lastOnly=SUMMARY.feature_mode==='last_cls';
const hybrid=SUMMARY.hybrid===true;
function clusterLabel(c){return c.source==='vlm'?`VLM ${c.cluster_id.replace('vlm:','')}${c.status==='uncertain'?' · 待确认':''}`:c.source==='dino'?`DINO 簇 ${c.dino_cluster_id}`:`簇 ${c.cluster_id}`}
function episodeLabel(r){return r.cluster_id===-1?(hybrid?'尚未完成 VLM 分组':'未归类'):r.source==='vlm'?`VLM ${r.cluster_id.replace('vlm:','')}${r.vlm_status==='uncertain'?' · 待确认':''}`:r.source==='dino'?`DINO 簇 ${r.dino_cluster_id}`:`簇 ${r.cluster_id}`}
$('heading').textContent=lastOnly?'RoboDojo · 尾帧聚类':'RoboDojo · 首尾帧聚类';
if(hybrid)$('heading').textContent='RoboDojo · DINO + VLM 补充分组';
document.title=$('heading').textContent;
$('notice').textContent=(lastOnly?'仅尾帧CLS参与聚类，首帧仅供对照':'首尾CLS各占50%')+' · HDBSCAN · 候选分组，待人工审核；未归类不代表错误';
if(hybrid)$('notice').textContent=`DINO 原分组保留 · VLM 仅处理原未归类样本（${{first:'首帧',last:'尾帧',first_last:'首尾帧'}[SUMMARY.vlm_frame_mode]}） · 两类分组互不合并 · 待人工审核`;
function node(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
$('summary').textContent=`${SUMMARY.tasks}个任务 · ${SUMMARY.episodes}个episode · ${SUMMARY.clusters}个任务内簇 · ${SUMMARY.noise}条未归类`;
if(hybrid){$('summary').textContent=`${SUMMARY.tasks}个任务 · ${SUMMARY.episodes}条 · DINO ${SUMMARY.dino_clusters}组 + VLM ${SUMMARY.vlm_clusters}组 · VLM待确认 ${SUMMARY.vlm_uncertain}条 · 尚未处理 ${SUMMARY.noise}条`;for(const [v,label] of [['dino','DINO 成员'],['vlm','VLM 补充成员'],['uncertain','VLM 待确认']]){const o=node('option',label);o.value=v;$('mode').append(o)}$('mode').querySelector('[value="center"]').textContent='代表成员';$('mode').querySelector('[value="noise"]').textContent='尚未处理'}
DATA.forEach((t,i)=>{const b=node('button',hybrid?`任务 ${t.task_id} · DINO ${t.dino_cluster_count} / VLM ${t.vlm_cluster_count}`:`任务 ${t.task_id} · ${t.cluster_count}簇 / 未归类${t.noise_count}`);b.dataset.task=i;b.append(node('small',t.task));b.onclick=()=>selectTask(i);$('tasks').append(b)});
function selectTask(i){current=i;const t=DATA[i];document.querySelectorAll('[data-task]').forEach(b=>b.classList.toggle('active',+b.dataset.task===i));$('taskTitle').textContent=t.task;$('stats').textContent=hybrid?`${t.episode_count}条 · 原未归类 ${t.original_noise_count}条 · VLM待确认 ${t.vlm_uncertain_count}条 · 尚未处理 ${t.noise_count}条`:`${t.episode_count}条 · ${t.cluster_count}簇 · 未归类${t.noise_count}条（${(t.noise_ratio*100).toFixed(1)}%）`;$('cluster').replaceChildren();for(const [v,label] of [['all','全部分组'],...t.clusters.map(c=>[c.cluster_id,`${clusterLabel(c)} · ${c.size}条`]),[-1,`${hybrid?'尚未处理':'未归类'} · ${t.noise_count}条`]]){const o=node('option',label);o.value=v;$('cluster').append(o)}$('mode').value='all';render()}
function render(){const t=DATA[current],mode=$('mode').value,group=$('cluster').value;$('grid').replaceChildren();$('pairs').replaceChildren();const chosen=t.clusters.find(c=>String(c.cluster_id)===group);if(chosen?.source==='vlm'){$('pairs').append(node('div',chosen.common_features),node('div','分组依据：'+chosen.reason))}if(mode==='cross'){for(const p of t.cross_pairs)$('pairs').append(node('div',`${p.a} ↔ ${p.b} · 余弦相似度 ${p.cosine.toFixed(4)}`))}const rows=t.episodes.filter(r=>(group==='all'||String(r.cluster_id)===group)&&(mode==='all'||mode==='noise'&&r.cluster_id===-1||mode==='uncertain'&&r.vlm_status==='uncertain'||mode==='dino'&&r.source==='dino'||mode==='vlm'&&r.source==='vlm'||r[mode]===true)).sort((a,b)=>String(a.cluster_id).localeCompare(String(b.cluster_id),undefined,{numeric:true})||(b.medoid_similarity??-1)-(a.medoid_similarity??-1));for(const r of rows){const card=node('article');card.append(node('h3',`${r.episode_id} · ${episodeLabel(r)}${r.medoid?' · Medoid':''}`));const labels=node('div');labels.className='labels';labels.append(node('span','首帧'),node('span','尾帧'));card.append(labels);const img=node('img');img.src=r.image;img.loading='lazy';img.alt=r.episode_id+' 首帧与尾帧';card.append(img);card.append(node('p',r.source==='vlm'?r.common_features+(r.center?' · 第二轮代表成员':''):r.medoid_similarity===null?(hybrid?'保留原未归类状态，等待 VLM 处理':'未分配到簇'):`与Medoid相似度 ${r.medoid_similarity.toFixed(4)} · 密度归属强度 ${r.membership_strength?.toFixed(3)??'无'}（非正确概率）`));$('grid').append(card)}if(!rows.length)$('grid').append(node('p','无对应样本'))}
$('mode').onchange=render;$('cluster').onchange=render;selectTask(0);
</script></html>
