<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboDojo VLM 全量聚类</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f6;color:#222;font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}header{padding:14px 20px;background:#fff;border-bottom:1px solid #ddd}h1{font-size:20px;margin:0}h2{font-size:18px;margin:0}#layout{display:grid;grid-template-columns:280px minmax(0,1fr);height:calc(100dvh - 80px)}aside{background:#fff;padding:12px;overflow:auto;border-right:1px solid #ddd}main{overflow:auto;padding:20px;min-width:0}button,select,input{font:inherit}button,select,summary{cursor:pointer}select,input{padding:8px;max-width:100%;border:1px solid #bac8c2;border-radius:4px}#task{width:100%}#task-text{font-size:12px;color:#58665f;overflow-wrap:anywhere}#groups button{display:block;width:100%;padding:10px;text-align:left;background:#fff;border:1px solid transparent;border-radius:4px;margin:6px 0;overflow-wrap:anywhere}#groups button[aria-pressed=true]{background:#e3f1eb;border-color:#43856d}#groups small{display:block;color:#58665f}#reason{border-bottom:1px solid #d3ddd7;padding-bottom:12px;overflow-wrap:anywhere}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}article{background:#fff;border:1px solid #d2ddd6;border-radius:5px;overflow:hidden;min-width:0}article h3{font-size:14px;margin:10px;overflow-wrap:anywhere}article p{margin:8px 10px;font-size:12px;color:#52625a}.labels{display:grid;grid-template-columns:1fr 1fr;text-align:center;color:#52625a;font-size:12px}article button{display:block;width:100%;border:0;padding:0;background:#edf1ef}article img{display:block;width:100%;aspect-ratio:8/3;object-fit:contain}a{color:#08694b}dialog{width:min(1350px,96vw);max-height:94dvh;overflow:auto;border:1px solid #b5c3bb;border-radius:5px}dialog::backdrop{background:#0009}dialog img{width:100%;aspect-ratio:8/3;object-fit:contain}.dialog-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere}button:focus-visible{outline:3px solid #258a67}@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:600px){#layout{display:block;height:auto}aside{max-height:280px}main{overflow:visible;padding:12px}header{padding:12px}}
</style>
<style>
textarea{font:inherit;width:100%;min-height:82px;resize:vertical;padding:8px;border:1px solid #bac8c2;border-radius:4px;background:#fff;color:inherit;line-height:1.5}.standards-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.standards-tools button{padding:6px 10px;border:1px solid #bac8c2;background:#fff;border-radius:4px}.standards-tools span{font-size:12px;color:#52625a}#standards-status.error{color:#a02525}.standard-editor{margin:12px 0}.standard-editor summary{font-weight:600}.standard-editor label{display:block;font-size:13px;margin:8px 0 5px}.effective{margin:8px 0 14px;border-left:3px solid #41866b;padding-left:10px}.effective strong{font-size:13px}.effective p{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:110px;overflow:auto;font-size:13px}#groups .standard-badge{font-size:12px;color:#1a7256}textarea:focus-visible{outline:3px solid #258a67;outline-offset:2px}
</style>
<header><h1>RoboDojo · VLM 全量聚类</h1><div id="stats"></div></header>
<div id="layout">
<aside>
<select id="task" aria-label="任务"></select><p id="task-text"></p>
<section class="standard-editor" aria-labelledby="task-editor-heading">
<h2 id="task-editor-heading" style="font-size:15px">任务默认审核标准</h2>
<label for="task-standard" id="task-standard-label"></label>
<textarea id="task-standard" rows="4" placeholder="填写当前任务的默认审核标准"></textarea>
<div class="standards-tools"><button id="save-task-standard" type="button">保存任务标准</button><span id="task-save-status" role="status" aria-live="polite"></span></div>
</section>
<div class="standards-tools"><button id="export-standards" type="button">导出标准</button><button id="import-standards" type="button">导入标准</button><input id="standards-file" type="file" accept=".json,application/json" hidden><span id="standards-status" role="status" aria-live="polite"></span></div>
<div id="groups"></div>
</aside>
<main>
<h2 id="title"></h2>
<section class="standard-editor" aria-labelledby="group-editor-heading">
<h2 id="group-editor-heading" style="font-size:16px">本组独立审核标准</h2>
<label for="group-standard" id="group-standard-label"></label>
<textarea id="group-standard" rows="3" placeholder="填写当前组的独立标准；留空则沿用任务默认标准"></textarea>
<div class="standards-tools"><button id="save-group-standard" type="button">保存本组标准</button><span id="group-save-status" role="status" aria-live="polite"></span></div>
</section>
<div class="effective"><strong id="effective-source"></strong><p id="effective-standard"></p></div>
<p id="features"></p><div id="reason"></div>
<div class="controls"><input id="search" placeholder="Episode 编号" aria-label="搜索"><label><input type="checkbox" id="reps">仅代表成员</label><span id="count"></span><a id="raw" target="_blank">原始结果 JSON</a></div><div class="grid" id="grid"></div>
</main></div>
<dialog id="detail"><div class="dialog-head"><h2 id="eid"></h2><button id="close">关闭</button></div><div class="labels"><span>首帧</span><span>尾帧</span></div><img id="large" alt="首尾帧"><details><summary>第一轮原始分组</summary><pre id="source"></pre></details></dialog>
<script src="data.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let ti=0,gi=0;
const task=()=>DATA.tasks[ti],group=()=>task().groups[gi];
$('stats').textContent=`${DATA.summary.completed_tasks}/${DATA.summary.tasks} 个任务 · ${DATA.summary.episodes} 条 · ${DATA.summary.groups} 组 · 首尾帧 · 每批 50 条 · 未经人工核验`;
$('task').innerHTML=DATA.tasks.map((t,i)=>`<option value="${i}">任务 ${t.task_id} · ${t.final_group_count} 组 · ${t.episode_count} 条</option>`).join('');
function renderTask(){const t=task();$('task-text').textContent=t.task;$('groups').innerHTML=t.groups.map((g,i)=>`<button data-group="${i}" aria-pressed="${i===gi}"><b>组 ${i+1} · ${g.member_episode_ids.length} 条${g.status==='uncertain'?' · 待确认':''}</b><small>${esc(g.common_features)}</small></button>`).join('');$('groups').querySelectorAll('button').forEach(b=>b.onclick=()=>{gi=Number(b.dataset.group);renderTask()});const g=group();$('title').textContent=`组 ${gi+1} · ${g.member_episode_ids.length} 条`;$('features').textContent=g.common_features;$('reason').textContent='合并理由：'+g.reason;$('raw').href=`../task_${String(t.task_id).padStart(3,'0')}/final.json`;renderGrid();window.reviewStandards?.sync()}
function renderGrid(){const t=task(),g=group(),q=$('search').value.trim();const ids=g.member_episode_ids.filter(id=>id.includes(q)&&(!$('reps').checked||t.episodes[id].representative));$('count').textContent=`${ids.length}/${g.member_episode_ids.length} 条`;$('grid').innerHTML=ids.map(id=>{const e=t.episodes[id];return `<article><h3>${esc(id)}${e.representative?' · 代表成员':''}</h3><div class="labels"><span>首帧</span><span>尾帧</span></div><button data-episode="${esc(id)}" aria-label="放大 ${esc(id)}"><img src="images/${esc(id)}.jpg" alt="${esc(id)} 首尾帧"></button><p>第一轮 ${esc(e.round1_group_id)}</p></article>`}).join('');$('grid').querySelectorAll('button').forEach(b=>b.onclick=()=>{const id=b.dataset.episode,e=t.episodes[id];$('eid').textContent=id;$('large').src=`images/${id}.jpg`;$('source').textContent=JSON.stringify(t.candidates.find(c=>c.group_id===e.round1_group_id),null,2);$('detail').showModal()})}
$('task').onchange=()=>{ti=Number($('task').value);gi=0;renderTask()};$('search').oninput=renderGrid;$('reps').onchange=renderGrid;$('close').onclick=()=>$('detail').close();renderTask();
</script><script src="review_standards.js"></script></html>
