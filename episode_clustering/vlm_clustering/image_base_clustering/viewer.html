<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RoboDojo · VLM 场景聚类</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#202625;font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif;letter-spacing:0}button,input,select{font:inherit}button,a,summary,select{cursor:pointer}a{color:#096b53}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #24836c;outline-offset:2px}header{padding:16px 22px;background:#fff;border-bottom:1px solid #dce0df;display:flex;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:20px;margin:0}h2{font-size:18px;margin:0}p{margin:8px 0}header small{color:#606b67}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);height:calc(100dvh - 72px)}aside{padding:16px 12px;overflow:auto;background:#fff;border-right:1px solid #dce0df}main{overflow:auto;padding:20px;min-width:0}.nav{display:flex;flex-direction:column;gap:8px}.nav button{background:transparent;text-align:left;border:1px solid transparent;border-radius:5px;padding:10px;color:inherit;width:100%;overflow-wrap:anywhere}.nav button[aria-pressed=true]{background:#e4f2ed;border-color:#4b8b76}.nav b{display:block}.nav span{font-size:12px;color:#56635d}.task{margin:0 0 14px;font-size:12px;color:#56635d;overflow-wrap:anywhere}.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:14px 0}.controls input[type=search]{width:230px;max-width:100%;padding:7px 9px;border:1px solid #bfc9c4;border-radius:4px}.controls label{display:flex;align-items:center;gap:6px}.info{border-bottom:1px solid #d7dfda;padding-bottom:14px}.info p{overflow-wrap:anywhere}.sources{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px}.sources a{font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.episode{border:1px solid #d7dedb;border-radius:6px;background:#fff;overflow:hidden;min-width:0}.episode-head{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.episode-head b{font-size:14px;overflow-wrap:anywhere}.rep{color:#8b5a08;font-size:12px}.pairs{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#e2e6e3}.frame{border:0;background:#fff;padding:0;min-width:0;color:inherit}.frame img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;background:#edf0ee}.frame span{display:block;font-size:12px;padding:4px 6px}.origin{padding:6px 12px;font-size:12px;color:#5b6861;overflow-wrap:anywhere}.empty{padding:30px;color:#59685f}dialog{width:min(1400px,96vw);max-height:94dvh;overflow:auto;border:1px solid #bbc7bf;border-radius:6px;padding:18px;background:#fff;color:#202625}dialog::backdrop{background:#0009}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}.dialog-head button{padding:6px 14px;background:#fff;border:1px solid #bbc7bf;border-radius:4px}.dialog-pairs{display:grid;grid-template-columns:1fr 1fr;gap:14px}.dialog-pairs figure{margin:0;min-width:0}.dialog-pairs img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#edf0ee}.dialog-pairs figcaption{font-size:13px}details{margin-top:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.status{color:#55635d;font-size:13px}#task-select{max-width:100%;padding:5px}body:has(dialog[open]) main{overflow:hidden}
@media(min-width:1700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){.layout{grid-template-columns:220px minmax(0,1fr)}.grid{grid-template-columns:1fr}}
@media(max-width:600px){header{padding:12px 14px;gap:4px}header small{width:100%}.layout{display:block;height:auto}aside{border-right:0;border-bottom:1px solid #dce0df;max-height:260px;padding:12px}.nav{display:grid;grid-template-columns:1fr 1fr}.task{margin-bottom:8px}main{overflow:visible;padding:14px}.dialog-pairs{grid-template-columns:1fr}dialog{padding:12px}.controls{gap:10px}.controls input[type=search]{width:100%}.controls label{min-height:36px}}
</style>
<header><h1>RoboDojo · VLM 场景聚类</h1><small id="stats"></small></header>
<div class="layout"><aside><select id="task-select" aria-label="任务"></select><p class="task" id="task"></p><nav class="nav" id="groups" aria-label="最终分组"></nav></aside>
<main id="main"><section class="info"><h2 id="title"></h2><p id="features"></p><p id="reason"></p><div class="status" id="status"></div><div class="sources" id="sources"></div></section>
<div class="controls"><input type="search" id="search" placeholder="Episode 编号" aria-label="搜索 episode"><label><input type="checkbox" id="reps">仅代表成员</label><span id="count" aria-live="polite"></span></div><div id="grid" class="grid"></div></main></div>
<dialog id="detail"><div class="dialog-head"><h2 id="detail-title"></h2><button id="close" type="button">关闭</button></div><div class="dialog-pairs" id="detail-images"></div><p id="detail-origin"></p><details><summary>第一轮原始分组</summary><pre id="detail-json"></pre></details></dialog>
<script src="data.js"></script>
<script>
const $=id=>document.getElementById(id);let taskIndex=0,groupIndex=0;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const task=()=>DATA.tasks[taskIndex];const group=()=>task().groups[groupIndex];
const statusName={coherent:'模型判为同类',singleton:'独立样本',uncertain:'模型无法确认'};
$('stats').textContent=`${DATA.summary.episodes} 条 · 已完成 ${DATA.summary.completed_tasks??DATA.tasks.length}/${DATA.summary.tasks} 个任务 · ${{first:'首帧',last:'尾帧',first_last:'首尾帧'}[DATA.config?.frame_mode??'first_last']} · 每批 ${DATA.config?.episodes_per_batch??50} 条 · 两轮${DATA.summary.pending_task_ids?.length?' · 未完成任务：'+DATA.summary.pending_task_ids.join('、'):''}`;
$('task-select').innerHTML=DATA.tasks.map((t,i)=>`<option value="${i}">任务 ${t.task_id} · ${t.episode_count} 条</option>`).join('');
$('task-select').hidden=DATA.tasks.length===1;
function renderTask(){const t=task();$('task').textContent=t.task;$('groups').innerHTML=t.groups.map((g,i)=>`<button type="button" data-group="${i}" aria-pressed="${i===groupIndex}"><b>组 ${i+1} · ${g.member_episode_ids.length} 条</b><span>${esc(g.common_features)}</span></button>`).join('');$('groups').querySelectorAll('button').forEach(b=>b.onclick=()=>{groupIndex=Number(b.dataset.group);renderTask();$('main').scrollTop=0});renderGroup()}
function renderGroup(){const g=group(),t=task();$('title').textContent=`组 ${groupIndex+1} · ${g.member_episode_ids.length} 条`;$('features').textContent=g.common_features;$('reason').textContent='合并理由：'+g.reason;$('status').textContent=`${statusName[g.status]??g.status} · 未经人工核验 · 第一轮 ${t.round1_group_count} 组 → 第二轮 ${t.final_group_count} 组`;$('sources').innerHTML=`<span>来源：${g.source_group_ids.map(esc).join('、')}</span><a href="${esc(t.raw_final)}" target="_blank">第二轮结果 JSON</a><a href="${esc(t.raw_round1)}" target="_blank">第一轮结果 JSON</a>`;renderGrid()}
function renderGrid(){const g=group(),t=task(),query=$('search').value.trim().toLowerCase();const members=g.member_episode_ids.filter(id=>id.toLowerCase().includes(query)&&(!$('reps').checked||t.episodes[id].representative));$('count').textContent=`显示 ${members.length} / ${g.member_episode_ids.length} 条`;$('grid').innerHTML=members.map(id=>{const e=t.episodes[id];return `<article class="episode" data-episode="${esc(id)}"><div class="episode-head"><b>${esc(id)}</b>${e.representative?'<span class="rep">第二轮代表成员</span>':''}</div><div class="pairs">${['first','last'].map(role=>`<button class="frame" data-open="${esc(id)}" type="button" aria-label="查看 ${esc(id)} ${role==='first'?'首帧':'尾帧'}"><img src="${esc(e[role].image)}" alt="${esc(id)} ${role==='first'?'首帧':'尾帧'}"><span>${role==='first'?'首帧':'尾帧'} · ${e[role].timestamp_sec.toFixed(2)} s</span></button>`).join('')}</div><div class="origin">第一轮 ${esc(e.round1_group_id)}</div></article>`}).join('')||'<div class="empty">没有匹配的成员</div>';$('grid').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openEpisode(b.dataset.open))}
function openEpisode(id){const e=task().episodes[id],candidate=task().candidates.find(g=>g.group_id===e.round1_group_id);$('detail-title').textContent=id;$('detail-images').innerHTML=['first','last'].map(role=>`<figure><img src="${esc(e[role].image)}" alt="${esc(id)} ${role==='first'?'首帧':'尾帧'}"><figcaption>${role==='first'?'首帧':'尾帧'} · ${e[role].timestamp_sec.toFixed(2)} s · frame ${e[role].frame_index}</figcaption></figure>`).join('');$('detail-origin').textContent=`第一轮 ${e.round1_group_id} → 最终 ${e.cluster_id}${e.representative?' · 第二轮代表成员':''}`;$('detail-json').textContent=JSON.stringify(candidate,null,2);$('detail').showModal()}
$('close').onclick=()=>$('detail').close();$('search').oninput=renderGrid;$('reps').onchange=renderGrid;$('task-select').onchange=()=>{taskIndex=Number($('task-select').value);groupIndex=0;renderTask()};renderTask();
</script></html>
