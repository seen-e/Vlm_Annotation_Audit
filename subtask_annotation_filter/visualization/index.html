<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RoboDojo 异常候选复核</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:#212724;background:#fff;letter-spacing:0}header{height:64px;border-bottom:1px solid #dbe1de;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:18px;margin:0}h2{font-size:16px;margin:0 0 8px}h3{font-size:14px;margin:0 0 8px}p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#626c66;font-size:12px}.shell{display:grid;grid-template-columns:250px minmax(320px,1fr) minmax(330px,1fr);height:calc(100vh - 64px)}aside,.pane{min-width:0;overflow:auto;scrollbar-gutter:stable;padding:16px;border-right:1px solid #dbe1de}aside{background:#f6f8f7;padding:12px}section{padding:16px 0;border-bottom:1px solid #dbe1de}section:first-child{padding-top:0}button,select{font:inherit;cursor:pointer;border:1px solid #cbd4ce;background:#fff;color:inherit;border-radius:4px;padding:6px 10px}button:hover{background:#edf3ef}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #238059;outline-offset:2px}.episode{width:100%;text-align:left;margin:4px 0}.episode[aria-current=true]{border-color:#197a52;background:#e3f1e9}.task-label{margin:18px 0 6px;color:#4c5b52;font-weight:600}.task-label:first-child{margin-top:0}video{display:block;width:100%;aspect-ratio:4/3;background:#111;object-fit:contain;max-height:48vh}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}a{color:#156847}.warning{color:#9e312c}.issue{border-left:3px solid #bf5547;padding:12px;background:#fff6f4;margin:12px 0}.issue.uncertain{border-left-color:#a77c25;background:#fffbed}blockquote{margin:8px 0;padding:8px 10px;background:#fff;border-left:2px solid #c8ccc9;overflow-wrap:anywhere}.evidence-path{font-size:12px;overflow-wrap:anywhere;color:#626c66}.subtask{padding:12px 0;border-bottom:1px solid #dbe1de;scroll-margin-top:12px}.subtask.affected{border-left:3px solid #bf5547;padding-left:10px}.subtask.selected{background:#e9f4ee}.badge{font-size:12px;color:#9e312c;margin-left:8px}.frames{display:grid;grid-template-columns:1fr 1fr;gap:8px}.frames img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain}.frame-label{font-size:12px;color:#626c66}details{margin:8px 0}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#taskText{font-size:13px}#playStatus{font-variant-numeric:tabular-nums}#snapshot{max-width:60%;text-align:right}.review-controls{margin-top:8px}label{display:flex;gap:8px;align-items:center}mark{background:#fff0a6;color:inherit}#rawLinks{font-size:12px}
@media(max-width:1000px){.shell{grid-template-columns:200px minmax(0,1fr)}#right{grid-column:2;overflow:visible}.shell{height:auto}aside{height:calc(100vh - 64px);position:sticky;top:0;grid-row:1/3}.pane{overflow:visible}video{max-height:55vh}}
@media(max-width:600px){header{height:auto;align-items:flex-start;flex-direction:column;padding:12px;gap:3px}#snapshot{max-width:100%;text-align:left}.shell{display:block}aside{position:static;height:210px;border-bottom:1px solid #dbe1de}.pane{padding:12px}video{max-height:none}h1{font-size:16px}}
</style></head><body>
<header><h1>RoboDojo · 异常候选复核</h1><div id="snapshot" class="muted"></div></header>
<div class="shell"><aside id="episodes" aria-label="Episode 列表"></aside>
<main class="pane" id="middle"><section><h2 id="eid"></h2><p id="taskText"></p><video id="video" controls preload="metadata" playsinline></video><div class="row"><button id="whole">播放整集</button><span id="playStatus" class="muted"></span></div><div id="rawLinks" class="row"></div><label class="review-controls">人工复核<select id="human"><option value="pending">待复核</option><option value="confirmed">确有异常</option><option value="false_positive">误报</option><option value="uncertain">无法判断</option></select></label><div class="row"><button id="save">保存复核</button><button id="export">导出复核</button><span id="saved" class="muted"></span></div></section>
<section><h2>审核标准</h2><p id="standard"></p><div id="standardSource" class="muted"></div></section>
<section><h2>首帧 / 尾帧</h2><div class="frames"><div><img id="first" alt="本 episode 首帧"><span class="frame-label">首帧</span></div><div><img id="last" alt="本 episode 尾帧"><span class="frame-label">尾帧</span></div></div></section>
<section><h2>原始末态摘要</h2><p id="terminal"></p></section></main>
<div class="pane" id="right"><section><h2>筛查疑点 <span class="muted">文本候选，尚未视频确认</span></h2><p id="reason"></p><div id="issues"></div></section><section><h2>原始 Subtasks</h2><div id="subtasks"></div></section></div></div>
<script src="data.js"></script><script>
const D=window.REVIEW_DATA,$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storeKey='robodojo_anomaly_human_review_v1:'+D.source_run;let human={};try{human=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){}let current=null,range=null;
const labels={criterion_not_met:'标准不满足',annotation_conflict:'标注冲突',insufficient_evidence:'证据不足'};
$('snapshot').textContent=`${D.episodes.length} 条 · ${D.task_count} 个任务 · 每任务最多 2 条 | ${new Date(D.generated_at).toLocaleString('zh-CN')}`;
let lastTask=null;for(const e of D.episodes){if(e.task_id!==lastTask){const title=document.createElement('div');title.className='task-label';title.textContent='任务 '+e.task_id;$('episodes').append(title);lastTask=e.task_id}const b=document.createElement('button');b.className='episode';b.dataset.id=e.episode_id;b.textContent=e.episode_id.replace('robodojo_','');b.onclick=()=>select(e.episode_id);$('episodes').append(b)}
function pathValue(obj,path){return path.split('/').slice(1).reduce((o,k)=>o?.[k.replace(/~1/g,'/').replace(/~0/g,'~')],obj)}
function highlight(value,path){let text=String(value??'');const quotes=current.review.issues.flatMap(i=>i.evidence||[]).filter(e=>e.path===path).map(e=>e.quote).filter(q=>text.includes(q));if(!quotes.length)return esc(text);const spans=[];for(const q of quotes){let at=text.indexOf(q);while(at>=0){spans.push([at,at+q.length]);at=text.indexOf(q,at+q.length)}}spans.sort((a,b)=>a[0]-b[0]);let out='',end=0;for(const [a,b] of spans){if(a<end)continue;out+=esc(text.slice(end,a))+'<mark>'+esc(text.slice(a,b))+'</mark>';end=b}return out+esc(text.slice(end))}
function select(id){current=D.episodes.find(e=>e.episode_id===id)||D.episodes[0];range=null;const e=current,base='episodes/'+e.episode_id+'/';document.querySelectorAll('.episode').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===e.episode_id)));$('eid').textContent=e.episode_id;$('taskText').textContent=e.task;$('video').src=base+'video.mp4';$('first').src=base+'first.png';$('last').src=base+'last.png';$('standard').textContent=e.review_standard;$('standardSource').textContent=e.standard_source==='group'?'标准来源：组内标准':'标准来源：任务默认标准';$('terminal').innerHTML=highlight(e.annotation.terminal_summary,'/terminal_summary');$('reason').textContent=e.review.reason;$('playStatus').textContent='整集 · '+e.duration.toFixed(2)+' 秒';$('human').value=human[e.episode_id]?.status||'pending';$('saved').textContent=human[e.episode_id]?'已保存到本机浏览器':'';
$('rawLinks').innerHTML=[['原始筛查 JSON','review.json'],['原始标注 JSON','final.json'],['筛查输入 JSON','review_input.json']].map(([name,file])=>`<a href="${base+file}" target="_blank">${name}</a>`).join('');
$('issues').innerHTML=e.review.issues.map((issue,i)=>`<article class="issue ${issue.severity==='uncertain'?'uncertain':''}"><h3>疑点 ${i+1} · ${esc(labels[issue.issue_type]||issue.issue_type)}${issue.severity==='uncertain'?'（不确定）':''}</h3><p>${esc(issue.reason)}</p>${issue.criterion?'<p><strong>对应标准：</strong>'+esc(issue.criterion)+'</p>':''}<div class="row">${issue.affected_subtasks.map(id=>`<button data-jump="${esc(id)}">Subtask ${esc(id)}</button>`).join('')}</div>${issue.evidence.map(ev=>`<div class="evidence-path">${esc(ev.path)}</div><blockquote>${esc(ev.quote)}</blockquote>`).join('')}<p><strong>视频核验：</strong>${esc(issue.video_check)}</p></article>`).join('');
const affected=new Set(e.review.issues.flatMap(i=>i.affected_subtasks));$('subtasks').innerHTML=e.annotation.subtasks.map((s,i)=>{const b=e.bounds[i],sid=b.subtask_index,p='/subtasks/'+i;return `<article id="sub-${esc(sid)}" class="subtask ${affected.has(sid)?'affected':''}"><div class="row"><button data-jump="${esc(sid)}">Subtask ${esc(sid)} ${b.start===null?'时间映射缺失':b.start.toFixed(2)+'–'+b.end.toFixed(2)+'s'}</button>${affected.has(sid)?'<span class="badge">涉及疑点</span>':''}</div><p>${highlight(s.segment_summary,p+'/segment_summary')}</p>${['arm_1','arm_2'].map(arm=>`<p><strong>${arm} · ${esc(s[arm]?.outcome)}</strong><br>${highlight(s[arm]?.description,p+'/'+arm+'/description')}</p>`).join('')}<details><summary>边界依据 / 其他字段</summary><p>${highlight(s.boundary_evidence,p+'/boundary_evidence')}</p><pre>${esc(JSON.stringify(s,null,2))}</pre></details></article>`}).join('');document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>playSubtask(b.dataset.jump));$('right').scrollTop=0;history.replaceState(null,'','?episode='+e.episode_id)}
function playSubtask(id){const b=current.bounds.find(x=>String(x.subtask_index)===String(id));const el=$('sub-'+id);document.querySelectorAll('.subtask').forEach(x=>x.classList.toggle('selected',x===el));el?.scrollIntoView({block:'nearest',behavior:'smooth'});if(!b||b.start===null){$('playStatus').textContent='缺少可靠时间映射，未定位';return}range=b;$('video').currentTime=b.start;$('video').play().catch(()=>{});$('playStatus').textContent=`Subtask ${id} · ${b.start.toFixed(2)}–${b.end.toFixed(2)} 秒`}
$('video').addEventListener('timeupdate',()=>{if(range&&$('video').currentTime>=range.end){$('video').pause();$('video').currentTime=range.end;}});$('video').addEventListener('play',()=>{if(range&&($('video').currentTime<range.start||$('video').currentTime>=range.end))$('video').currentTime=range.start});$('whole').onclick=()=>{range=null;$('video').currentTime=0;$('video').play().catch(()=>{});$('playStatus').textContent='整集 · '+current.duration.toFixed(2)+' 秒'};
$('save').onclick=()=>{human[current.episode_id]={status:$('human').value,updated_at:new Date().toISOString()};try{localStorage.setItem(storeKey,JSON.stringify(human));$('saved').textContent='已保存到本机浏览器'}catch(e){$('saved').textContent='本机保存失败，请导出复核'}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({source_run:D.source_run,exported_at:new Date().toISOString(),episodes:human},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='robodojo_anomaly_human_review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
select(new URLSearchParams(location.search).get('episode')||D.episodes[0].episode_id);
</script></body></html>
